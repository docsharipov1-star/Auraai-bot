<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Пульт клиники Аура</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: reception desk console — sticky header with tabs, one content column up to 820px; cards for forms, lists, tables */
:root {
  --bg: #EEF2F4;
  --card: #FFFFFF;
  --fg: #10202A;
  --muted: #5B6B75;
  --line: #D7E0E5;
  --accent: #0B7480;
  --accent-ink: #FFFFFF;
  --accent-soft: #D8EEF0;
  --ok: #1F7A4A;
  --ok-soft: #DCF0E4;
  --warn: #A3620A;
  --warn-soft: #F7EAD3;
  --bad: #B0362A;
  --bad-soft: #F6DEDA;
  --f-ui: "Onest", "Segoe UI", system-ui, sans-serif;
  --f-num: "JetBrains Mono", ui-monospace, "SFMono-Regular", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1418; --card: #142026; --fg: #E3ECF0; --muted: #8FA2AC; --line: #24343C;
    --accent: #3BB8C4; --accent-ink: #062126; --accent-soft: #15353A; --ok: #5CCB8E; --ok-soft: #173426;
    --warn: #E5AE52; --warn-soft: #3A2D16; --bad: #F08A7C; --bad-soft: #3D1F1B; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1418; --card: #142026; --fg: #E3ECF0; --muted: #8FA2AC; --line: #24343C;
  --accent: #3BB8C4; --accent-ink: #062126; --accent-soft: #15353A; --ok: #5CCB8E; --ok-soft: #173426;
  --warn: #E5AE52; --warn-soft: #3A2D16; --bad: #F08A7C; --bad-soft: #3D1F1B; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--f-ui); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 820px; margin: 0 auto; }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 10px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font-weight: 800; font-size: 21px; letter-spacing: -0.02em; }
h1 span { color: var(--accent); }
.who { font-size: 12px; color: var(--muted); }
nav { display: flex; gap: 4px; margin-top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px; overflow-x: auto; scrollbar-width: none; }
nav button { flex: 1 0 auto; font: 600 14px var(--f-ui); color: var(--muted); background: none; border: 0; border-radius: 9px; padding: 9px 10px; cursor: pointer; white-space: nowrap; }
nav button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
nav button .cnt { display: inline-block; min-width: 18px; margin-left: 4px; padding: 0 5px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; line-height: 18px; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { display: flex; flex-direction: column; gap: 16px; margin-top: 6px; }
.datebar, .monthbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.datebar .d { text-align: center; min-width: 0; }
.datebar .d b, .monthbar b { display: block; font-size: 18px; font-weight: 700; }
.datebar .d small { color: var(--muted); font-size: 12px; }
.round { width: 40px; height: 40px; flex: none; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--fg); font-size: 18px; cursor: pointer; }
.link { font: 600 13px var(--f-ui); color: var(--accent); background: none; border: 0; cursor: pointer; padding: 2px 4px; }
h2 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 0 0 8px 2px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
.card > h3 { margin: 0 0 12px; font-size: 16px; font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.progress { display: flex; align-items: center; gap: 12px; }
.track { flex: 1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.track i { display: block; height: 100%; background: var(--ok); border-radius: 4px; }
.progress b { font-family: var(--f-num); font-size: 14px; white-space: nowrap; }
.list { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.task { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 13px 14px; color: var(--fg); font: inherit; cursor: pointer; }
.task:first-child { border-top: 0; }
.box { flex: none; width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--accent); display: grid; place-items: center; color: var(--accent-ink); font-weight: 800; font-size: 13px; margin-top: 1px; }
.task.done .box { background: var(--accent); }
.task.done .tt { color: var(--muted); text-decoration: line-through; }
.tt { min-width: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.grid .full { grid-column: 1 / -1; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 500; min-width: 0; }
label.chk { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--fg); }
label.chk input { width: auto; }
input, select, textarea { font: 500 15px var(--f-ui); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; width: 100%; min-width: 0; }
input[type="number"], .num { font-family: var(--f-num); }
textarea { min-height: 64px; resize: vertical; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button, .chip { font: 600 13px var(--f-ui); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.chip.ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.chip.bad { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.chip.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.btn { font: 700 15px var(--f-ui); color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 11px; padding: 12px 16px; cursor: pointer; }
.btn.ghost { color: var(--accent); background: var(--accent-soft); }
.btn.sm { font-size: 13px; padding: 8px 12px; border-radius: 9px; }
.btn.wide { width: 100%; margin-top: 12px; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
.row { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row.click { cursor: pointer; width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; font: inherit; color: inherit; }
.row .main { flex: 1; min-width: 0; }
.row .main small { display: block; color: var(--muted); font-size: 12px; }
.row .sum { font-family: var(--f-num); font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.x { flex: none; border: 0; background: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
.x.confirm { color: var(--bad); background: var(--bad-soft); font-size: 12px; font-weight: 700; }
.empty { padding: 16px; color: var(--muted); font-size: 14px; text-align: center; }
.pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--fg); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-width: 0; }
.kpi span { display: block; font-size: 12px; color: var(--muted); }
.kpi b { display: block; font-family: var(--f-num); font-size: 21px; font-variant-numeric: tabular-nums; margin-top: 2px; overflow-wrap: anywhere; }
.kpi small { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.kpi.good b { color: var(--ok); } .kpi.bad b { color: var(--bad); }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td.n, th.n { text-align: right; font-family: var(--f-num); font-variant-numeric: tabular-nums; }
tr.total td { font-weight: 700; border-bottom: 0; }
.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--f-num); font-size: 10px; fill: var(--muted); }
.close-grid { display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px 12px; align-items: center; font-size: 14px; }
.close-grid .h { font-size: 12px; color: var(--muted); }
.close-grid .n { font-family: var(--f-num); text-align: right; white-space: nowrap; }
.close-grid input { padding: 7px 8px; max-width: 120px; text-align: right; }
.edit-row { display: grid; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.edit-row:first-of-type { border-top: 0; }
.er-doc { grid-template-columns: minmax(0, 2fr) 76px minmax(0, 2fr) auto; }
.er-two { grid-template-columns: minmax(0, 3fr) minmax(0, 1.3fr) auto; }
.er-task { grid-template-columns: minmax(0, 3fr) minmax(0, 1fr) minmax(0, 1fr) auto; }
.er-item { grid-template-columns: minmax(0, 2fr) 80px minmax(0, 1fr) auto auto; }
.er-one { grid-template-columns: minmax(0, 1fr) auto; }
@media (max-width: 560px) {
  .er-doc { grid-template-columns: minmax(0, 1fr) 70px auto; }
  .er-doc .sp { grid-column: 1 / -1; grid-row: 2; }
  .er-task { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; }
  .er-task .txt { grid-column: 1 / -1; }
  .er-item { grid-template-columns: minmax(0, 1fr) 64px auto; }
  .er-item .svc { grid-column: 1 / -1; }
}
.hint { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
.savebar { position: sticky; bottom: max(12px, env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--fg); color: var(--bg); border-radius: 14px; padding: 10px 10px 10px 16px; z-index: 4; }
.status { font-size: 13px; color: var(--muted); text-align: center; margin-top: 14px; }
.status.warn { color: var(--bad); }
.toast { color: var(--ok); font-size: 13px; text-align: center; min-height: 18px; margin-top: 6px; }
.qcard { padding: 12px 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.qcard:first-child { border-top: 0; }
.qhead { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.qhead b { font-size: 15px; }
.phone { font-family: var(--f-num); font-size: 14px; user-select: all; }
.qwhy { font-size: 13px; color: var(--muted); }
.inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.inline input[type="date"] { width: auto; padding: 7px 8px; }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; font-size: 13px; }
.meta div span { display: block; color: var(--muted); font-size: 12px; }
.plan { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-top: 10px; background: var(--card); }
.plan-head { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: center; }
.bar-h { display: grid; grid-template-columns: minmax(90px, 1fr) 3fr auto; gap: 8px; align-items: center; font-size: 13px; margin-top: 6px; }
.bar-h .track i { background: var(--accent); }
.filebtn { position: relative; overflow: hidden; display: inline-block; }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Пульт клиники <span>Аура</span></h1>
      <div class="who" id="who"></div>
    </div>
    <nav role="tablist" id="nav"></nav>
  </header>
  <main id="main"><div class="empty">Загрузка…</div></main>
  <p class="status" id="status"></p>
</div>

<script>
(function () {
  "use strict";

  // ══════════ НАСТРОЙКИ ПО УМОЛЧАНИЮ (до загрузки config/main) ══════════
  const DEFAULT_CFG = {

      { name: "Коммуналка", amount: 22000 }, { name: "Мусор", amount: 7500 },
    ],
    services: ["Консультация", "Лечение", "Пломбирование", "Реставрация", "Удаление", "Имплантация",
      "Коронка", "Протезирование", "Чистка", "Отбеливание", "Рентген", "Штифт/стекловолокно"],
    pays: ["Наличные", "Терминал", "Перевод"],

    callsTarget: 20,
    tasks: [
      { id: "a01", section: "Утро", days: "all", text: "Прийти за 15 минут до открытия: свет, кондиционер, музыка" },

      { id: "a03", section: "Утро", days: "all", text: "Санузел: туалетная бумага, мыло, бумажные полотенца, освежитель, чистота" },
      { id: "a04", section: "Утро", days: "all", text: "Ресепшен: салфетки, антисептик, бахилы, ручки, визитки" },
      { id: "a05", section: "Утро", days: "all", text: "Кулер: вода и стаканчики; чай и кофе для пациентов" },
      { id: "a06", section: "Утро", days: "all", text: "Кабинеты: салфетки, антисептик, перчатки, нагрудники — проверить с ассистентами" },
      { id: "a07", section: "Утро", days: "all", text: "Пересчитать кассу на начало дня" },
      { id: "a08", section: "Утро", days: "all", text: "Расписание на сегодня, карты пациентов подготовлены" },
      { id: "a09", section: "Утро", days: "all", text: "Ответить на все сообщения и пропущенные звонки за ночь" },
      { id: "b01", section: "Обходы", days: "all", text: "11:00 · санузел (бумага, мыло, полотенца), холл, ресепшен" },
      { id: "b02", section: "Обходы", days: "all", text: "13:00 · санузел, холл, мусорные вёдра, кулер" },
      { id: "b03", section: "Обходы", days: "all", text: "15:00 · санузел, холл, салфетки и антисептик" },

      { id: "b05", section: "Обходы", days: "all", text: "19:00 · санузел, холл, мусор" },
      { id: "c01", section: "День", days: "all", text: "Каждый приём — сразу во вкладку «Приём»" },
      { id: "c02", section: "День", days: "all", text: "Каждого пациента после приёма записать на следующий визит" },
      { id: "c03", section: "День", days: "all", text: "Отмечать посещаемость: пришёл / не пришёл / перенёс" },
      { id: "c04", section: "День", days: "all", text: "Отвечать на звонки и сообщения в течение 15 минут" },
      { id: "c05", section: "День", days: "all", text: "Обзвон по спискам во вкладке «Обзвон» — выполнить цель дня" },
      { id: "c06", section: "День", days: "all", text: "Новых пациентов спрашивать, откуда узнали о клинике" },
      { id: "d01", section: "Вечер", days: "all", text: "Подтвердить всех пациентов на завтра" },
      { id: "d02", section: "Вечер", days: "all", text: "Позвонить вчерашним пациентам — как самочувствие" },
      { id: "d03", section: "Вечер", days: "all", text: "Попросить отзыв на картах у 2 довольных пациентов" },
      { id: "d04", section: "Вечер", days: "all", text: "Закрыть кассу во вкладке «Приём»: наличные, терминал, переводы" },
      { id: "d05", section: "Вечер", days: "all", text: "Вынести мусор, проверить санузел перед уходом" },
      { id: "d06", section: "Вечер", days: "all", text: "Выключить оборудование, свет, кондиционер; закрыть окна и двери" },
      { id: "w01", section: "Утро", days: 1, text: "Проверить остатки материалов и составить заказ" },

    ],
  };
  const SECTIONS = ["Утро", "Обходы", "День", "Вечер"];
  const KINDS = ["Первичный", "Повторный"];
  const PLAN_STATUSES = ["Предложен", "Согласован", "В работе", "Завершён", "Отказ"];
  const OPEN_PLAN = new Set(["Предложен", "Согласован", "В работе"]);
  const QUEUES = [
    ["callback", "Перезвонить", "Перезвонить"],
    ["confirm", "Подтвердить запись на завтра", "Подтверждение"],
    ["noshow", "Не пришли", "Неявка"],
    ["after", "После приёма — самочувствие", "После приёма"],
    ["plans", "Незавершённые планы лечения", "План лечения"],
    ["lost", "Потерянные пациенты", "Потерянный"],
  ];
  const DOW_SHORT = ["Вс", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];
  const DOWS = ["воскресенье", "понедельник", "вторник", "среда", "четверг", "пятница", "суббота"];
  const MONTHS = ["январь", "февраль", "март", "апрель", "май", "июнь", "июль", "август", "сентябрь", "октябрь", "ноябрь", "декабрь"];
  const MONTHS_GEN = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];

  // ══════════ УТИЛИТЫ ══════════
  const pad = (n) => String(n).padStart(2, "0");
  const keyOf = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const parseKey = (k) => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d || 1); };
  const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
  const monthOf = (k) => k.slice(0, 7);
  const addMonths = (m, n) => { const d = parseKey(m + "-01"); d.setMonth(d.getMonth() + n); return keyOf(d).slice(0, 7); };
  const daysIn = (m) => { const d = parseKey(m + "-01"); return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); };
  const fmtDay = (k) => { if (!k) return "—"; const d = parseKey(k); return d.getDate() + " " + MONTHS_GEN[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? " " + d.getFullYear() : ""); };
  const rub = (n) => Math.round(n || 0).toLocaleString("ru-RU") + " ₽";
  const num = (v) => { const x = Number(String(v == null ? "" : v).replace(/\s/g, "").replace(",", ".").replace(/[^\d.-]/g, "")); return Number.isFinite(x) ? x : 0; };
  const pct = (a, b) => (b ? Math.round(a / b * 100) : 0) + "%";
  const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const todayKey = () => keyOf(new Date());
  const live = (o) => Object.entries(o || {}).filter(([, v]) => v && typeof v === "object").map(([id, v]) => ({ id, ...v }));

  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === false || v == null) continue;
      if (k === "class") el.className = v;
      else if (k === "value") el.value = v;
      else if (k === "checked") el.checked = !!v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    return el;
  }

  // ══════════ ХРАНИЛИЩЕ: сервер пульта (SQLite), опрос изменений каждые 4 сек ══════════
  const Store = (() => {
    const watchers = new Set();
    let seq = 0, offline = false;
    async function api(method, url, body) {
      let r;
      try {
        r = await fetch(url, { method, credentials: "same-origin",
          headers: body !== undefined ? { "Content-Type": "application/json" } : {},
          body: body !== undefined ? JSON.stringify(body) : undefined });
      } catch (e) { throw { code: "unavailable", message: "нет связи с сервером" }; }
      let j = null;
      try { j = await r.json(); } catch (e) {}
      if (r.status === 401) { showLogin(); throw { code: "unauth", message: "нужно войти" }; }
      if (r.status === 403) throw { code: "invalid_argument", message: (j && j.error) || "нет прав" };
      if (!r.ok) throw { code: r.status === 413 ? "quota_exceeded" : "unavailable", message: (j && j.error) || "ошибка сервера" };
      return j;
    }
    async function run(w) {
      try {
        if (w.kind === "doc") { const r = await api("GET", "/api/doc?path=" + encodeURIComponent(w.path)); if (watchers.has(w)) w.cb(r.data); }
        else { const list = await api("POST", "/api/query", { coll: w.coll, where: w.where }); if (watchers.has(w)) w.cb(list); }
      } catch (e) {}
    }
    async function poll() {
      try {
        const r = await api("GET", "/api/changes?since=" + seq);
        if (r.seq !== seq) {
          for (const w of watchers)
            if (r.reset || r.paths.some((p) => w.kind === "doc" ? p === w.path : p.startsWith(w.coll + "/"))) run(w);
          seq = r.seq;
        }
        if (offline) { offline = false; setStatus(""); }
      } catch (e) {
        if (e.code === "unavailable") { offline = true; setStatus("Нет связи с сервером — изменения подтянутся, когда связь вернётся.", true); }
      }
      setTimeout(poll, document.hidden ? 15000 : 4000);
    }
    return {
      api,
      get live() { return true; },
      async start() { try { seq = (await api("GET", "/api/changes?since=0")).seq; } catch (e) {} setTimeout(poll, 4000); },
      refreshAll() { watchers.forEach(run); },
      watchDoc(path, cb) { const w = { kind: "doc", path, cb }; watchers.add(w); run(w); return () => watchers.delete(w); },
      watchColl(coll, where, cb) { const w = { kind: "coll", coll, where, cb }; watchers.add(w); run(w); return () => watchers.delete(w); },
      async getRange(coll, field, from, to) { return api("POST", "/api/query", { coll, where: [[field, ">=", from], [field, "<=", to]] }); },
      async get(path) { return (await api("GET", "/api/doc?path=" + encodeURIComponent(path))).data; },
      async set(path, data) { await api("PUT", "/api/doc", { path, data }); },
      async merge(path, data) { await api("PATCH", "/api/doc", { path, data }); },
      async del(path) { await api("DELETE", "/api/doc?path=" + encodeURIComponent(path)); },
    };
  })();

  // ══════════ СОСТОЯНИЕ ══════════
  const S = {
    tab: "tasks", day: todayKey(), repMonth: monthOf(todayKey()),
    cfg: clone(DEFAULT_CFG), cfgLoaded: false,
    dayDoc: {}, patients: {}, plans: {}, mDays: [],
    isOwner: true, uid: null,
    vd: { pid: "", query: "", isNew: false, name: "", phone: "", source: "", doctor: "", service: "", amount: "", pay: "Наличные", kind: "Повторный", next: "" },
    ed: { name: "", amount: "" },
    closeDraft: null, cfgDraft: null, cfgDirty: false, armed: null,
    search: "", selPid: null, pDraft: null, planDraft: null, qOpen: {}, qInput: {}, restoreFile: null,
    access: [], accDraft: "", loginShown: false,
  };
  try { const t = localStorage.getItem("aura-pult-tab"); if (t) S.tab = t; } catch (e) {}

  function setStatus(msg, warn) { const el = document.getElementById("status"); el.textContent = msg || ""; el.classList.toggle("warn", !!warn); }
  async function guard(p, okMsg) {
    try { await p; if (okMsg) toast(okMsg); return true; }
    catch (e) {
      setStatus(e && e.code === "invalid_argument" ? "Нет прав на это действие." :
        e && e.code === "quota_exceeded" ? "Хранилище заполнено — сделай резервную копию и напиши владельцу." : "Не сохранилось. Проверь интернет и повтори.", true);
      return false;
    }
  }
  let toastTimer;
  function toast(msg) {
    const els = document.querySelectorAll(".toast"); if (!els.length) return;
    els.forEach((el) => { el.textContent = msg; });
    clearTimeout(toastTimer); toastTimer = setTimeout(() => document.querySelectorAll(".toast").forEach((el) => { el.textContent = ""; }), 2400);
  }

  // ══════════ ЗАПИСИ ══════════
  const dayPath = (k) => "day/" + k;
  const writeDay = (k, partial) => Store.merge(dayPath(k), { date: k, ...partial });
  const patientList = () => Object.entries(S.patients).map(([id, p]) => ({ id, ...p }));
  const pName = (pid) => (S.patients[pid] && S.patients[pid].name) || "Без имени";
  const openPlans = (pid) => Object.entries(S.plans).filter(([, p]) => p.patientId === pid && OPEN_PLAN.has(p.status));
  const planTotal = (pl) => (pl.items || []).reduce((s, i) => s + num(i.price), 0);
  const planDone = (pl) => (pl.items || []).filter((i) => i.done).reduce((s, i) => s + num(i.price), 0);
  function updatePatient(pid, data) { S.patients[pid] = { ...(S.patients[pid] || {}), ...data }; return guard(Store.merge("patients/" + pid, data)); }

  // ══════════ РАСЧЁТЫ ══════════
  function specialMap(str) {
    const m = {};
    for (const part of String(str || "").split(/[;,\n]/)) {
      const r = part.match(/^\s*(.+?)\s*[=:]\s*(\d{1,3})\s*%?\s*$/);
      if (r) m[r[1].toLowerCase()] = Number(r[2]);
    }
    return m;
  }
  function pctFor(doctor, service) {
    const d = S.cfg.doctors.find((x) => x.name === doctor);
    if (!d) return 0;
    const s = String(service || "").toLowerCase();
    for (const [k, v] of Object.entries(specialMap(d.special))) if (s.includes(k) || k.includes(s)) return v;
    return num(d.pct);
  }
  const tasksFor = (k) => { const dow = parseKey(k).getDay(); return S.cfg.tasks.filter((t) => t.days === "all" || Number(t.days) === dow); };

  function queues() {
    const T = todayKey(), tm = addDays(T, 1), yd = addDays(T, -1), lostBefore = addDays(T, -(num(S.cfg.lostDays) || 90));
    const since = (p, k) => p.lastCall && p.lastCall.date >= k;
    const Q = Object.fromEntries(QUEUES.map(([k]) => [k, []]));
    for (const p of patientList()) {
      if (p.noCall) continue;
      const quiet = p.quietUntil && p.quietUntil > T;
      const hasNext = p.nextVisit && p.nextVisit >= T;
      if (p.callback && p.callback.date && p.callback.date <= T) Q.callback.push(p);
      else if (p.nextVisit === tm && !(p.lastCall && p.lastCall.date === T)) Q.confirm.push(p);
      else if (p.noShowAt && p.noShowAt >= addDays(T, -3) && !hasNext && !since(p, p.noShowAt)) Q.noshow.push(p);
      else if (p.lastVisit === yd && !since(p, T)) Q.after.push(p);
      else if (!quiet && openPlans(p.id).length && !hasNext && !since(p, addDays(T, -7))) Q.plans.push(p);
      else if (!quiet && p.lastVisit && p.lastVisit <= lostBefore && !hasNext && !since(p, addDays(T, -14))) Q.lost.push(p);
    }
    Q.lost.sort((a, b) => String(b.lastVisit).localeCompare(String(a.lastVisit)));
    return Q;
  }

  function computeMonth(days, m) {
    const r = { revenue: 0, count: 0, paid: 0, primary: 0, byPay: {}, doctors: {}, daily: Array(daysIn(m)).fill(0), variable: 0,
      calls: 0, booked: 0, callTypes: {}, noshow: 0, came: 0, moved: 0, uniq: new Set(), taskDays: [], cashDiff: [] };
    for (const d of days) {
      const day = Number(String(d.date).slice(8, 10));
      const visits = live(d.visits);
      for (const v of visits) {
        const a = num(v.amount);
        r.revenue += a; r.count++; if (a > 0) r.paid++;
        if (v.kind === "Первичный") r.primary++;
        if (v.patientId) r.uniq.add(v.patientId);
        r.byPay[v.pay || "—"] = (r.byPay[v.pay || "—"] || 0) + a;
        const x = r.doctors[v.doctor] || (r.doctors[v.doctor] = { revenue: 0, count: 0, paid: 0, pay: 0 });
        x.revenue += a; x.count++; if (a > 0) x.paid++; x.pay += a * pctFor(v.doctor, v.service) / 100;
        if (day >= 1 && day <= r.daily.length) r.daily[day - 1] += a;
      }
      for (const e of live(d.expenses)) r.variable += num(e.amount);
      for (const c of live(d.calls)) {
        r.calls++; const ok = c.result === "Записан" || c.result === "Подтвердил"; if (ok) r.booked++;
        const t = r.callTypes[c.type] || (r.callTypes[c.type] = { n: 0, booked: 0 });
        t.n++; if (ok) t.booked++;
      }
      for (const a of live(d.attendance)) { if (a.status === "Не пришёл") r.noshow++; else if (a.status === "Пришёл") r.came++; else if (a.status === "Перенёс") r.moved++; }
      const tasks = tasksFor(d.date), checks = d.checks || {};
      if (tasks.length && (visits.length || Object.keys(checks).length)) r.taskDays.push({ date: d.date, pct: tasks.filter((t) => checks[t.id]).length / tasks.length });
      if (d.closing && d.closing.fact) {
        let diff = 0; for (const [k, v] of Object.entries(d.closing.fact)) diff += num(v) - num((d.closing.expected || {})[k]);
        if (Math.abs(diff) >= 1) r.cashDiff.push({ date: d.date, diff });
      }
    }
    r.taskDays.sort((a, b) => a.date.localeCompare(b.date));
    r.cashDiff.sort((a, b) => a.date.localeCompare(b.date));
    r.doctorsPay = Object.values(r.doctors).reduce((s, d) => s + d.pay, 0);
    r.staff = S.cfg.staff.reduce((s, x) => s + num(x.salary), 0);
    r.fixed = S.cfg.fixed.reduce((s, x) => s + num(x.amount), 0);
    r.avg = r.paid ? r.revenue / r.paid : 0;
    r.profit = r.revenue - r.doctorsPay - r.staff - r.fixed - r.variable;
    const from = m + "-01", to = m + "-" + pad(daysIn(m));
    r.newPatients = patientList().filter((p) => p.firstVisit && p.firstVisit >= from && p.firstVisit <= to);
    r.bySource = {};
    for (const p of r.newPatients) r.bySource[p.source || "Не указан"] = (r.bySource[p.source || "Не указан"] || 0) + 1;
    r.plans = Object.values(S.plans).filter((p) => String(p.created || "").slice(0, 7) === m);
    r.planSum = { proposed: 0, agreed: 0, done: 0, refused: 0, byDoctor: {} };
    for (const p of r.plans) {
      const t = planTotal(p), agreed = p.status !== "Предложен" && p.status !== "Отказ";
      r.planSum.proposed += t;
      if (agreed) r.planSum.agreed += t;
      if (p.status === "Отказ") r.planSum.refused += t;
      r.planSum.done += planDone(p);
      const bd = r.planSum.byDoctor[p.doctor || "—"] || (r.planSum.byDoctor[p.doctor || "—"] = { n: 0, proposed: 0, agreed: 0 });
      bd.n++; bd.proposed += t; if (agreed) bd.agreed += t;
    }
    return r;
  }

  // ══════════ ПОДПИСКИ ══════════
  let daySub = null, monthSub = null;
  function subscribeDay() {
    if (daySub) daySub();
    daySub = Store.watchDoc(dayPath(S.day), (d) => {

      requestRender();
    });
  }
  function subscribeMonth() {
    if (monthSub) monthSub();
    const m = S.repMonth;
    monthSub = Store.watchColl("day", [["date", ">=", m + "-01"], ["date", "<=", m + "-" + pad(daysIn(m))]], (list) => { S.mDays = list; requestRender(); });
  }

  // ══════════ РЕНДЕР ══════════
  const $main = document.getElementById("main");
  let pendingRender = false;
  const typing = () => { const a = document.activeElement; return a && $main.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== "checkbox" && a.type !== "file"; };
  function requestRender() { if (typing()) { pendingRender = true; return; } render(); }
  $main.addEventListener("focusout", () => setTimeout(() => { if (pendingRender && !typing()) { pendingRender = false; render(); } }, 0));

  const TABS = [["tasks", "Задачи"], ["visit", "Приём"], ["calls", "Обзвон"], ["patients", "Пациенты"], ["stats", "Аналитика", true], ["settings", "Настройки", true]];
  function renderNav() {
    const qn = Object.values(queues()).reduce((s, a) => s + a.length, 0);
    document.getElementById("nav").replaceChildren(...TABS.filter((t) => !t[2] || S.isOwner).map(([id, label]) =>
      h("button", { role: "tab", id: "tab-" + id, "aria-selected": String(S.tab === id), onclick: () => switchTab(id) },
        label, id === "calls" && qn ? h("span", { class: "cnt" }, qn) : null)));
  }
  function switchTab(id) {
    if (S.tab === "settings" && S.cfgDirty && id !== "settings") setStatus("Настройки не сохранены — вернись во вкладку «Настройки» и нажми «Сохранить».", true);
    S.tab = id; S.armed = null;
    try { localStorage.setItem("aura-pult-tab", id); } catch (e) {}
    if (id === "settings" && !S.cfgDirty) S.cfgDraft = clone(S.cfg);

  }

  function dateBar() {
    const d = parseKey(S.day), isToday = S.day === todayKey();

    return h("div", { class: "datebar" },

  const kpi = (lbl, val, cls, sub) => h("div", { class: "kpi " + (cls || "") }, h("span", {}, lbl), h("b", {}, val), sub ? h("small", {}, sub) : null);
  const delBtn = (key, onDel) => h("button", {

  // ── ЗАДАЧИ ──
  function renderTasks() {

    const done = tasks.filter((t) => checks[t.id]).length;

        kpi("Звонков", calls.length + (target ? " / " + target : ""), target && calls.length >= target ? "good" : "", "записано: " + booked),
        kpi("Приёмов", String(live(S.dayDoc.visits).length))),
      h("div", { class: "card progress" }, h("div", { class: "track" }, h("i", { style: "width:" + (tasks.length ? Math.round(done / tasks.length * 100) : 0) + "%" })), h("b", {}, pct(done, tasks.length)))];
    for (const sec of SECTIONS) {

        }))));

    out.push(h("div", { class: "toast" }));

  }
  function toggleTask(id) {
    const v = !((S.dayDoc.checks || {})[id]);

    render();

  }

  // ── ПРИЁМ ──
  const pLabel = (p) => (p.name || "Без имени") + (p.phone ? " · " + p.phone : "") + (p.doctor ? " · " + p.doctor : "");
  function patientPicker(D) {
    const listId = "pl-visit";

    return h("div", { class: "full" },
      h("label", { class: "f" }, "Пациент",
        h("input", { id: "v-patient", list: listId, autocomplete: "off", value: D.pid && S.patients[D.pid] ? pLabel(S.patients[D.pid]) : D.query, placeholder: "Начни вводить имя или телефон",
          disabled: D.isNew,

      h("datalist", { id: listId }, pats.slice(0, 1500).map((p) => h("option", { value: pLabel(p) }))),
      h("div", { class: "inline", style: "margin-top:6px" },
        h("label", { class: "chk" }, h("input", { type: "checkbox", id: "v-isnew", checked: D.isNew,
          onchange: (e) => { D.isNew = e.target.checked; if (D.isNew) { D.pid = ""; D.kind = "Первичный"; if (!D.name) D.name = D.query; } render(); } }), "Новый пациент"),
        D.pid ? h("span", { class: "pill ok" }, "выбран") : D.query && !D.isNew ? h("span", { class: "qwhy" }, "выбери из подсказок или отметь «Новый пациент»") : null));
  }

  function addVisit() {
    const D = S.vd, amount = num(D.amount), k = S.day;
    if (!D.doctor) { toast("Выбери врача"); return; }
    if (D.isNew && !D.name.trim()) { toast("Впиши имя нового пациента"); return; }
    let pid = D.pid;
    const at = new Date().toISOString();
    if (D.isNew) {
      pid = rid();
      const p = { name: D.name.trim(), phone: D.phone.trim(), doctor: D.doctor, source: D.source, created: at, firstVisit: k, lastVisit: k };
      if (D.next) p.nextVisit = D.next;
      S.patients[pid] = p;
      guard(Store.set("patients/" + pid, p));
    }
    const vid = rid();
    const v = { patientId: pid || "", doctor: D.doctor, service: D.service, amount, pay: D.pay, kind: D.kind, at, by: S.uid || "" };
    const partial = { visits: { [vid]: v } };
    if (pid && !D.isNew) {
      const p = S.patients[pid] || {};
      const upd = { lastVisit: !p.lastVisit || p.lastVisit < k ? k : p.lastVisit };
      if (!p.firstVisit || p.firstVisit > k) upd.firstVisit = k;
      if (!p.doctor) upd.doctor = D.doctor;
      if (D.next) upd.nextVisit = D.next; else if (p.nextVisit === k) upd.nextVisit = "";
      if (p.nextVisit === k || (S.dayDoc.attendance || {})[pid]) partial.attendance = { [pid]: { status: "Пришёл", at } };
      updatePatient(pid, upd);
    }
    S.dayDoc = { ...S.dayDoc, visits: { ...(S.dayDoc.visits || {}), [vid]: v },
      attendance: partial.attendance ? { ...(S.dayDoc.attendance || {}), ...partial.attendance } : S.dayDoc.attendance };
    Object.assign(D, { pid: "", query: "", isNew: false, name: "", phone: "", source: "", amount: "", next: "", kind: "Повторный" });
    render();
    guard(writeDay(k, partial), "Приём добавлен");
  }

  // ── ОБЗВОН ──
  function logCall(p, type, result, date) {
    const T = todayKey(), id = rid(), at = new Date().toISOString();
    const call = { patientId: p.id, type, result, at, by: S.uid || "" };
    const upd = { lastCall: { date: T, type, result } };
    if (result === "Записан") { upd.nextVisit = date || addDays(T, 1); upd.callback = null; upd.noShowAt = ""; }
    else if (result === "Перезвонить") upd.callback = { date: date || addDays(T, 1), note: "" };
    else if (result === "Не дозвонились") upd.callback = { date: addDays(T, 1), note: "не дозвонились " + fmtDay(T) };
    else if (result === "Отказ") { upd.callback = null; upd.quietUntil = addDays(T, 90); }
    else upd.callback = null;
    if (date && result === "Записан") call.visitDate = date;
    updatePatient(p.id, upd);
    if (S.day === T) S.dayDoc = { ...S.dayDoc, calls: { ...(S.dayDoc.calls || {}), [id]: call } };
    render();
    guard(writeDay(T, { calls: { [id]: call } }), "Звонок записан");
  }

  function queueCard(p, qk, type) {
    const key = qk + p.id, open = S.qOpen[key], T = todayKey();
    const why = qk === "callback" ? "Перезвонить " + fmtDay(p.callback.date) + (p.callback.note ? " · " + p.callback.note : "")

      try { navigator.clipboard.writeText(p.phone || "").then(() => toast("Номер скопирован"), () => toast("Выдели номер и скопируй вручную")); }
      catch (e) { toast("Выдели номер и скопируй вручную"); }
    };
    const pick = (r) => {
      if (r === "Записан" || r === "Перезвонить") { S.qOpen[key] = r; S.qInput[key] = S.qInput[key] || addDays(T, 1); render(); return; }
      logCall(p, type, r);
    };
    const results = qk === "confirm" ? ["Подтвердил", "Перезвонить", "Не дозвонились", "Отказ"]
      : qk === "after" ? ["Всё хорошо", "Записан", "Перезвонить", "Не дозвонились"]
      : ["Записан", "Перезвонить", "Не дозвонились", "Отказ"];

    return h("div", { class: "qcard" },
      h("div", { class: "qhead" },
        h("b", {}, p.name || "Без имени", p.doctor ? h("span", { class: "qwhy" }, " · " + p.doctor) : null),

  function renderCalls() {

  function barChart(daily) {
    const W = 360, H = 150, L = 34, R = 4, T = 8, B = 20;
    const max = Math.max(1, ...daily), step = Math.pow(10, Math.floor(Math.log10(max))), top = Math.ceil(max / step) * step;
    const bw = (W - L - R) / daily.length;
    let s = '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Выручка по дням">';
    for (let j = 0; j <= 4; j++) {
      const v = top * j / 4, y = T + (H - T - B) * (1 - j / 4);
      s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '" style="stroke:var(--line)" stroke-width="1"/>';
      s += '<text x="' + (L - 4) + '" y="' + (y + 3) + '" text-anchor="end">' + (v >= 1000 ? Math.round(v / 1000) + "к" : Math.round(v)) + "</text>";
    }
    daily.forEach((v, i) => {
      const bh = (H - T - B) * v / top, x = L + i * bw + 1, y = H - B - bh;
      if (v > 0) s += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + Math.max(1, bw - 2).toFixed(1) + '" height="' + bh.toFixed(1) + '" rx="1.5" style="fill:var(--accent)"/>';
      if (i === 0 || (i + 1) % 5 === 0) s += '<text x="' + (x + (bw - 2) / 2).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + (i + 1) + "</text>";
    });
    return s + "</svg>";
  }

          h("div", { class: "sp" }, inp(d, "special", { "aria-label": "Особые услуги", placeholder: "Особые услуги: Удаление=30" })), del(C.doctors, i))),
        addBtn("Врач", () => C.doctors.push({ name: "", pct: 30, special: "" })),
        h("p", { class: "hint" }, "Процент — от выручки врача. «Особые услуги» — свой процент на услугу: «Удаление=30; Имплантация=25».")),
      h("div", { class: "card" }, h("h3", {}, "Сотрудники и оклады"),
        C.staff.length ? C.staff.map((s, i) => h("div", { class: "edit-row er-two" },
          inp(s, "name", { "aria-label": "Сотрудник", placeholder: "Администратор Анна" }), inp(s, "salary", { type: "number", "aria-label": "Оклад в месяц", placeholder: "Оклад, ₽" }), del(C.staff, i)))
          : h("p", { class: "hint" }, "Добавь администраторов, ассистентов, санитарок."),
        addBtn("Сотрудник", () => C.staff.push({ name: "", salary: "" }))),
      h("div", { class: "card" }, h("h3", {}, "Постоянные расходы в месяц · " + rub(C.fixed.reduce((s, x) => s + num(x.amount), 0))),
        C.fixed.map((x, i) => h("div", { class: "edit-row er-two" }, inp(x, "name", { "aria-label": "Статья расхода" }), inp(x, "amount", { type: "number", "aria-label": "Сумма в месяц" }), del(C.fixed, i))),
        addBtn("Статья расхода", () => C.fixed.push({ name: "", amount: "" }))),
      h("div", { class: "card" }, h("h3", {}, "Обзвон"),
        h("div", { class: "grid" },
          h("label", { class: "f" }, "Цель звонков в день", inp(C, "callsTarget", { type: "number", min: "0" })),
          h("label", { class: "f" }, "«Потерянный», если не был дней", inp(C, "lostDays", { type: "number", min: "30" })))),
      h("div", { class: "card" }, h("h3", {}, "Задачи администратора · " + C.tasks.length),
        C.tasks.map((t, i) => h("div", { class: "edit-row er-task" },
          h("div", { class: "txt" }, inp(t, "text", { "aria-label": "Задача", placeholder: "Что сделать" })),
          h("select", { "aria-label": "Когда", onchange: (e) => { t.section = e.target.value; dirty(); } }, SECTIONS.map((s) => h("option", { value: s, selected: t.section === s }, s))),
          h("select", { "aria-label": "Дни", onchange: (e) => { t.days = e.target.value === "all" ? "all" : Number(e.target.value); dirty(); } },
            h("option", { value: "all", selected: t.days === "all" }, "Каждый день"),
            [1, 2, 3, 4, 5, 6, 0].map((n) => h("option", { value: String(n), selected: t.days !== "all" && Number(t.days) === n }, "Только " + DOW_SHORT[n]))),
          del(C.tasks, i))),
        addBtn("Задача", () => C.tasks.push({ id: "t" + rid(), text: "", section: "День", days: "all" }))),
      list("Услуги", C.services, "Услуга"),
      list("Виды оплаты", C.pays, "Вид оплаты"),
      list("Откуда узнают о клинике", C.sources, "Источник"),
      S.isOwner ? h("div", { class: "card" }, h("h3", {}, "Доступ администраторов"),
        h("p", { class: "qwhy", style: "margin:0 0 8px" }, "Почты, с которых можно войти как администратор. Код для входа приходит на эту почту. Владелец входит со своей почты, она задана на сервере."),
        S.access.length ? S.access.map((em, i) => h("div", { class: "edit-row er-one acc-row" }, h("span", {}, em),
          h("button", { class: "x", "aria-label": "Убрать доступ", onclick: () => { const a = S.access.filter((_, j) => j !== i); S.access = a; render(); guard(Store.set("config/access", { admins: a }), "Доступ убран"); } }, "×")))
          : h("p", { class: "hint" }, "Пока ни у кого нет доступа. Добавь почту администратора."),
        h("div", { class: "inline", style: "margin-top:8px" },
          h("input", { id: "acc-email", type: "email", placeholder: "admin@mail.ru", value: S.accDraft, style: "flex:1;min-width:180px", oninput: (e) => { S.accDraft = e.target.value; } }),
          h("button", { class: "btn sm", onclick: () => {
            const em = String(S.accDraft || "").trim().toLowerCase();
            if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { toast("Проверь почту"); return; }
            if (S.access.includes(em)) { toast("Эта почта уже есть"); return; }
            const a = [...S.access, em]; S.access = a; S.accDraft = ""; render();
            guard(Store.set("config/access", { admins: a }), "Доступ выдан");
          } }, "Дать доступ"))) : null,
      h("div", { class: "card" }, h("h3", {}, "Резервная копия"),
        h("p", {}, "Сервер сам сохраняет копию каждый день и хранит последние 30. Кнопка ниже скачивает файл со всем (пациенты, планы, приёмы, расходы, звонки, касса, задачи, настройки) — раз в неделю сохраняй его у себя."),
        h("div", { class: "btns" },
          h("button", { class: "btn", onclick: backup }, "Скачать полную копию"),
          h("span", { class: "btn ghost filebtn" }, "Восстановить из файла",
            h("input", { type: "file", accept: ".json,application/json", "aria-label": "Файл резервной копии", onchange: (e) => {
              const f = e.target.files && e.target.files[0]; e.target.value = "";
              if (f) { S.restoreFile = f; render(); }
            } }))),
        S.restoreFile ? h("div", { class: "inline", style: "margin-top:10px" },
          h("span", { class: "qwhy" }, "Восстановить из «" + S.restoreFile.name + "»? Записи с теми же номерами будут заменены."),
          h("button", { class: "btn sm", onclick: () => { const f = S.restoreFile; S.restoreFile = null; render(); restore(f); } }, "Да, восстановить"),
          h("button", { class: "link", onclick: () => { S.restoreFile = null; render(); } }, "Отмена")) : null),
      h("div", { class: "toast" }),
      S.cfgDirty ? saveBar() : null,
    ];
  }

  function render() {
    if (!S.isOwner && (S.tab === "stats" || S.tab === "settings")) S.tab = "tasks";
    if (!TABS.some((t) => t[0] === S.tab)) S.tab = "tasks";
    renderNav();
    const fn = { tasks: renderTasks, visit: renderVisit, calls: renderCalls, patients: renderPatients, stats: renderStats, settings: renderSettings }[S.tab];
    $main.replaceChildren(...fn().flat(Infinity).filter(Boolean));
  }

  // ══════════ СТАРТ ══════════
  function startSubs() {
    Store.watchDoc("config/main", (d) => {
      if (d) { S.cfg = { ...clone(DEFAULT_CFG), ...d }; if (!S.cfgDirty) S.cfgDraft = null; }
      S.cfgLoaded = true; requestRender();
    });
    Store.watchColl("patients", [], (list) => { const m = {}; for (const p of list) { const { id, ...rest } = p; m[id] = rest; } S.patients = m; requestRender(); });
    Store.watchColl("plans", [], (list) => { const m = {}; for (const p of list) { const { id, ...rest } = p; m[id] = rest; } S.plans = m; requestRender(); });
    if (S.isOwner) Store.watchDoc("config/access", (d) => { S.access = (d && d.admins) || []; requestRender(); });
    subscribeDay();
    subscribeMonth();
  }

  // ══════════ ВХОД ПО ПОЧТЕ ══════════
  function showLogin() {
    if (S.loginShown) return;
    S.loginShown = true;
    document.getElementById("nav").replaceChildren();
    document.getElementById("who").textContent = "";
    const st = { email: "", code: "", step: 1, busy: false, msg: "" };
    const post = async (url, body) => {
      const r = await fetch(url, { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      let j = {};
      try { j = await r.json(); } catch (e) {}
      if (!r.ok) throw new Error(j.error || "Что-то пошло не так, попробуй ещё раз");
      return j;
    };
    async function send() {
      if (st.busy) return;
      st.busy = true; st.msg = ""; draw();
      try { await post("/api/login/request", { email: st.email.trim() }); st.step = 2; st.code = ""; }
      catch (e) { st.msg = e.message; }
      st.busy = false; draw();
    }
    async function verify() {
      if (st.busy) return;
      st.busy = true; st.msg = ""; draw();
      try { await post("/api/login/verify", { email: st.email.trim(), code: st.code }); location.reload(); return; }
      catch (e) { st.msg = e.message; }
      st.busy = false; draw();
    }
    function draw() {
      $main.replaceChildren(h("div", { class: "card", style: "max-width:420px;width:100%;margin:24px auto 0" },
        h("h3", {}, "Вход в пульт"),
        st.step === 1 ? [
          h("p", { class: "qwhy", style: "margin:0 0 10px" }, "Введи рабочую почту — пришлём код для входа."),
          h("label", { class: "f" }, "Почта", h("input", { id: "l-email", type: "email", autocomplete: "email", value: st.email, placeholder: "name@mail.ru",
            oninput: (e) => { st.email = e.target.value; }, onkeydown: (e) => { if (e.key === "Enter") send(); } })),
          h("button", { class: "btn wide", onclick: send, disabled: st.busy }, st.busy ? "Отправляю…" : "Получить код"),
        ] : [
          h("p", { class: "qwhy", style: "margin:0 0 10px" }, "Если у почты " + st.email.trim() + " есть доступ, код придёт в течение минуты. Проверь и папку «Спам»."),
          h("label", { class: "f" }, "Код из письма", h("input", { id: "l-code", inputmode: "numeric", autocomplete: "one-time-code", value: st.code, placeholder: "6 цифр",
            oninput: (e) => { st.code = e.target.value; }, onkeydown: (e) => { if (e.key === "Enter") verify(); } })),
          h("button", { class: "btn wide", onclick: verify, disabled: st.busy }, st.busy ? "Проверяю…" : "Войти"),
          h("div", { class: "btns" },
            h("button", { class: "link", onclick: () => { st.step = 1; st.msg = ""; draw(); } }, "Другая почта"),
            h("button", { class: "link", onclick: send }, "Прислать код ещё раз")),
        ],
        st.msg ? h("p", { class: "hint", style: "color:var(--bad)" }, st.msg) : null));
      const f = document.getElementById(st.step === 1 ? "l-email" : "l-code");
      if (f) f.focus();
    }
    draw();
  }

  function renderWho(me) {
    document.getElementById("who").replaceChildren(
      me.email + (me.role === "owner" ? " · владелец · " : " · администратор · "),
      h("button", { class: "link", onclick: async () => { try { await fetch("/api/logout", { method: "POST", credentials: "same-origin" }); } catch (e) {} location.reload(); } }, "Выйти"));
  }

  (async () => {
    let me;
    try { me = await Store.api("GET", "/api/me"); }
    catch (e) { if (e.code !== "unauth") $main.replaceChildren(h("div", { class: "card empty" }, "Сервер недоступен. Обнови страницу через минуту.")); return; }
    S.isOwner = me.role === "owner";
    S.uid = me.email;
    renderWho(me);
    await Store.start();
    startSubs();
    render();
  })();
})();
</script>

</body>
</html>
