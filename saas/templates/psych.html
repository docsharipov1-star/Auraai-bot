<title>Аура — психологическая поддержка</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:          #09090B;
  --surface:     #111116;
  --panel:       #18181F;
  --border:      rgba(255,255,255,0.07);
  --border-hi:   rgba(139,180,137,0.3);
  --ai-bg:       #161B24;
  --user-bg:     #0F2318;
  --accent:      #6BCB87;
  --accent-2:    #4A9E8A;
  --accent-glow: rgba(107,203,135,0.15);
  --text:        #A1A1AA;
  --text-hi:     #FAFAFA;
  --text-dim:    #52525B;
  --serif: Georgia, 'Times New Roman', serif;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}

html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); -webkit-font-smoothing: antialiased; }

/* ── ambient glow ── */
body::before {
  content: '';
  position: fixed;
  top: -20%;
  left: 50%;
  transform: translateX(-50%);
  width: 600px;
  height: 400px;
  background: radial-gradient(ellipse, rgba(107,203,135,0.06) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

.layout {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 700px;
  margin: 0 auto;
}

/* ── Header ── */
.header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.avatar {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: linear-gradient(135deg, #1A3D28 0%, #0F2318 100%);
  border: 1px solid rgba(107,203,135,0.25);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  position: relative;
}
.avatar-letter {
  font-family: var(--serif);
  font-size: 17px;
  font-style: italic;
  color: var(--accent);
  line-height: 1;
}
.online {
  position: absolute; bottom: 1px; right: 1px;
  width: 9px; height: 9px;
  background: var(--accent);
  border-radius: 50%;
  border: 2px solid var(--bg);
  box-shadow: 0 0 6px var(--accent);
}

.header-info { flex: 1; min-width: 0; }
.header-name {
  font-size: 15px; font-weight: 500; color: var(--text-hi);
  letter-spacing: -0.01em;
}
.header-status { font-size: 12px; color: var(--text-dim); margin-top: 1px; }

.btn-ghost {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 5px 11px;
  border-radius: 6px;
  font-size: 12px;
  font-family: var(--sans);
  cursor: pointer;
  transition: border-color .15s, color .15s;
  white-space: nowrap;
}
.btn-ghost:hover { border-color: var(--border-hi); color: var(--accent); }
.btn-ghost:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ── Messages ── */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 28px 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  scroll-behavior: smooth;
}
.messages::-webkit-scrollbar { width: 4px; }
.messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.07); border-radius: 2px; }

/* ── Empty state ── */
.empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 20px;
  padding: 40px 24px;
}

.empty-icon {
  width: 64px; height: 64px;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(107,203,135,0.15) 0%, rgba(74,158,138,0.08) 100%);
  border: 1px solid rgba(107,203,135,0.2);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--serif);
  font-size: 26px;
  font-style: italic;
  color: var(--accent);
  box-shadow: 0 0 32px rgba(107,203,135,0.08);
}

.empty-title {
  font-size: 20px;
  font-weight: 500;
  color: var(--text-hi);
  letter-spacing: -0.02em;
  text-wrap: balance;
}
.empty-sub {
  font-size: 14px;
  color: var(--text-dim);
  line-height: 1.7;
  max-width: 300px;
  text-wrap: balance;
}

.chips {
  display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
  margin-top: 4px;
}
.chip {
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 7px 14px;
  border-radius: 100px;
  font-size: 13px;
  cursor: pointer;
  font-family: var(--sans);
  transition: background .15s, border-color .15s, color .15s;
}
.chip:hover { background: rgba(107,203,135,0.08); border-color: var(--border-hi); color: var(--text-hi); }
.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ── Message bubbles ── */
.msg-row {
  display: flex;
  flex-direction: column;
  gap: 3px;
  max-width: 82%;
  animation: up .2s ease both;
}
@keyframes up { from { opacity:0; transform:translateY(6px) } to { opacity:1; transform:none } }

.msg-row.ai   { align-self: flex-start; }
.msg-row.user { align-self: flex-end; }

.bubble {
  padding: 11px 15px;
  font-size: 14.5px;
  line-height: 1.65;
  word-break: break-word;
  white-space: pre-wrap;
}

.msg-row.ai .bubble {
  background: var(--ai-bg);
  border: 1px solid var(--border);
  border-radius: 4px 16px 16px 16px;
  color: var(--text-hi);
}

.msg-row.user .bubble {
  background: var(--user-bg);
  border: 1px solid rgba(107,203,135,0.12);
  border-radius: 16px 4px 16px 16px;
  color: var(--text-hi);
}

.msg-time {
  font-size: 11px;
  color: var(--text-dim);
  padding: 0 4px;
}
.msg-row.user .msg-time { text-align: right; }

/* ── Typing ── */
.typing-row {
  align-self: flex-start;
  animation: up .2s ease both;
}
.typing-bubble {
  background: var(--ai-bg);
  border: 1px solid var(--border);
  border-radius: 4px 16px 16px 16px;
  padding: 13px 18px;
  display: flex; gap: 5px; align-items: center;
}
.dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--accent);
  opacity: .4;
  animation: blink 1.2s ease-in-out infinite;
}
.dot:nth-child(2) { animation-delay: .2s; }
.dot:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%,80%,100%{opacity:.4;transform:scale(1)} 40%{opacity:1;transform:scale(1.3)} }

/* ── Input area ── */
.input-wrap {
  padding: 12px 16px 16px;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

.input-box {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 10px 10px 10px 16px;
  transition: border-color .2s, box-shadow .2s;
}
.input-box:focus-within {
  border-color: var(--border-hi);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

textarea {
  flex: 1;
  background: none; border: none; outline: none;
  color: var(--text-hi);
  font-family: var(--sans);
  font-size: 14.5px;
  line-height: 1.5;
  resize: none;
  min-height: 22px;
  max-height: 140px;
  overflow-y: auto;
}
textarea::placeholder { color: var(--text-dim); }

.send-btn {
  width: 34px; height: 34px;
  border-radius: 9px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: opacity .15s, transform .1s;
  color: #0A1A0F;
}
.send-btn:hover  { opacity: .9; }
.send-btn:active { transform: scale(.91); }
.send-btn:disabled { opacity: .25; cursor: default; }
.send-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.hint {
  font-size: 11px;
  color: var(--text-dim);
  text-align: center;
  padding: 8px 4px 0;
  line-height: 1.5;
}

@media (prefers-reduced-motion: reduce) {
  .msg-row, .typing-row { animation: none; }
  .dot { animation: none; opacity: .6; }
}
</style>

<div class="layout">
  <header class="header">
    <div class="avatar">
      <span class="avatar-letter">А</span>
      <span class="online" aria-label="онлайн"></span>
    </div>
    <div class="header-info">
      <div class="header-name">Аура</div>
      <div class="header-status">психологическая поддержка · онлайн</div>
    </div>
    <button class="btn-ghost" onclick="resetChat()">Новый разговор</button>
  </header>

  <div class="messages" id="messages" role="log" aria-live="polite">
    <div class="empty" id="emptyState">
      <div class="empty-icon" aria-hidden="true">А</div>
      <div class="empty-title">Здесь тебя выслушают</div>
      <div class="empty-sub">Без осуждения и советов навырост — просто поговорим о том, что тебя беспокоит</div>
      <div class="chips">
        <button class="chip" onclick="useChip(this)">Чувствую тревогу</button>
        <button class="chip" onclick="useChip(this)">Сложные отношения</button>
        <button class="chip" onclick="useChip(this)">Стресс и выгорание</button>
        <button class="chip" onclick="useChip(this)">Просто поговорить</button>
      </div>
    </div>
  </div>

  <div class="input-wrap">
    <div class="input-box">
      <textarea
        id="inp"
        placeholder="Напиши, что тебя беспокоит…"
        rows="1"
        aria-label="Сообщение"
        onkeydown="onKey(event)"
        oninput="resize(this)"
      ></textarea>
      <button class="send-btn" id="sendBtn" onclick="send()" aria-label="Отправить" disabled>
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
          <path d="M13.5 7.5L1.5 1.5l2 6-2 6 12-6z" fill="currentColor"/>
        </svg>
      </button>
    </div>
    <div class="hint">
      Аура — AI-помощник, не замена специалисту.
      При кризисе: <strong style="color:var(--text)">8-800-2000-122</strong> (бесплатно)
    </div>
  </div>
</div>

<script>
  let sid = 'web_' + Math.random().toString(36).slice(2,9);
  let busy = false;
  const msgs = document.getElementById('messages');
  const inp  = document.getElementById('inp');
  const btn  = document.getElementById('sendBtn');

  inp.addEventListener('input', () => { btn.disabled = !inp.value.trim(); });

  function resize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 140) + 'px';
  }

  function onKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!btn.disabled) send(); }
  }

  function ts() {
    return new Date().toLocaleTimeString('ru', {hour:'2-digit', minute:'2-digit'});
  }

  function removeEmpty() {
    document.getElementById('emptyState')?.remove();
  }

  function addMsg(text, role) {
    removeEmpty();
    const row = document.createElement('div');
    row.className = `msg-row ${role}`;
    const b = document.createElement('div');
    b.className = 'bubble';
    b.textContent = text;
    const t = document.createElement('div');
    t.className = 'msg-time';
    t.textContent = ts();
    row.append(b, t);
    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
    return row;
  }

  function showTyping() {
    const r = document.createElement('div');
    r.className = 'typing-row'; r.id = 'typing';
    r.innerHTML = '<div class="typing-bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
    msgs.appendChild(r);
    msgs.scrollTop = msgs.scrollHeight;
  }
  function hideTyping() { document.getElementById('typing')?.remove(); }

  async function send() {
    const text = inp.value.trim();
    if (!text || busy) return;
    inp.value = ''; inp.style.height = 'auto'; btn.disabled = true;
    addMsg(text, 'user');
    busy = true; showTyping();

    try {
      const r = await fetch('/api/psych/chat', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({session_id: sid, message: text})
      });
      const d = await r.json();
      hideTyping();
      addMsg(d.reply || 'Что-то пошло не так, попробуй ещё раз.', 'ai');
    } catch {
      hideTyping();
      addMsg('Нет соединения с сервером. Попробуй позже.', 'ai');
    }
    busy = false; inp.focus();
  }

  function useChip(el) {
    inp.value = el.textContent;
    resize(inp); btn.disabled = false; send();
  }

  async function resetChat() {
    sid = 'web_' + Math.random().toString(36).slice(2,9);
    msgs.innerHTML = `
      <div class="empty" id="emptyState">
        <div class="empty-icon" aria-hidden="true">А</div>
        <div class="empty-title">Здесь тебя выслушают</div>
        <div class="empty-sub">Без осуждения и советов навырост — просто поговорим о том, что тебя беспокоит</div>
        <div class="chips">
          <button class="chip" onclick="useChip(this)">Чувствую тревогу</button>
          <button class="chip" onclick="useChip(this)">Сложные отношения</button>
          <button class="chip" onclick="useChip(this)">Стресс и выгорание</button>
          <button class="chip" onclick="useChip(this)">Просто поговорить</button>
        </div>
      </div>`;
  }

  // Получить приветствие при загрузке
  (async () => {
    try {
      const r = await fetch('/api/psych/start', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({session_id: sid})
      });
      if (r.ok) { const d = await r.json(); addMsg(d.greeting, 'ai'); }
    } catch { /* показываем empty state */ }
  })();
</script>
